name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Crear proyecto Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init "Calculadora Solar MF" com.mfconsultoria.calculadora --web-dir=www
          npx cap add android
      - name: Poner icono
        run: |
          test -f icon.png || (echo "NO ENCUENTRO icon.png" && exit 1)
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          rm -f $RES/mipmap-*/ic_launcher*
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            for n in ic_launcher ic_launcher_round; do
              convert icon.png -resize "${s}x${s}^" -gravity center -extent "${s}x${s}" $RES/mipmap-$d/$n.png
            done
          done
          ls -l $RES/mipmap-xxxhdpi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
